<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./assets/css/styles.css" />
  <script
      src="https://cdn.jsdelivr.net/npm/dayjs@1.11.3/dayjs.min.js"
      integrity="sha256-iu/zLUB+QgISXBLCW/mcDi/rnf4m4uEDO0wauy76x7U="
      crossorigin="anonymous"
    ></script>
  <title>Scheduler</title>
</head>

<body>
    <!--Page Header-->
    <div id="header" class="row justify-content-center align-items-center">Scheduler and Timeblocker</div>
    <div class=".container">
        <div class="row border">
            <div class="col-1 border">
                <div class="row">
                    Add projects and commitments, change preferences
                </div>
                <div class="row">
                    <button type="button" class="btn btn-outline-primary" id="add_project">Add new project</button>
                </div>
                <div class="row">
                    <button type="button" class="btn btn-outline-primary" id="add_commitment">Add new commitment</button>
                </div>
                <div class="row">
                    <button type="button" class="btn btn-outline-primary" id="change_preferences">Change Preferences</button>
                </div>
            </div>
            <div class="col-9 border">
              Weekly schedule
              <div class="row border">
              <div class="col border">time</div>
              <div class="col border">1</div>
              <div class="col border">2</div>
              <div class="col border">3</div>
              <div class="col border">4</div>
              <div class="col border">5</div>
              <div class="col border">6</div>
              <div class="col border">7</div>
              </div>
            </div>
            <div class="col-2 border">
              admin todo lists, edit current projects and commitments
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
